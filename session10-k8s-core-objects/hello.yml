# Task 4: short-lived batch Pod to watch ContainerCreating -> Running -> Completed
apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
  labels:
    owner: mayank
spec:
  restartPolicy: Never
  containers:
    - name: hello
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Hello from Mayank busybox pod'; sleep 3"]
