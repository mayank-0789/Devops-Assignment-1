# Desired state lives here, in Git. Argo CD makes the cluster match it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayank-gitops-app
  namespace: session20-gitops
  labels:
    app: mayank-gitops-app
    owner: mayank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mayank-gitops-app
  template:
    metadata:
      labels:
        app: mayank-gitops-app
        owner: mayank
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=Hello from Mayank's GitOps app, deployed by Argo CD"]
          ports:
            - containerPort: 5678
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
