# Backend: tiny Python HTTP API that reports its configuration.
# Bulk config comes from the ConfigMap (envFrom), credentials come key-by-key from the Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayankapp-backend
  labels:
    app: mayankapp
    tier: backend
    owner: mayank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mayankapp
      tier: backend
  template:
    metadata:
      labels:
        app: mayankapp
        tier: backend
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mayankapp-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mayankapp-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mayankapp-db-secret
                  key: POSTGRES_PASSWORD
          command: ["python3", "-c"]
          args:
            - |
              import os, http.server
              KEYS = ["APP_NAME", "ENVIRONMENT", "LOG_LEVEL", "DEFAULT_CURRENCY", "POSTGRES_USER"]
              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = "Mayank App backend API\n"
                      body += "".join(f"{k}: {os.environ.get(k, '<unset>')}\n" for k in KEYS)
                      body += f"served path: {self.path}\n"
                      data = body.encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)
                  def log_message(self, *a):
                      pass
              http.server.HTTPServer(("", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mayankapp-backend
  labels:
    app: mayankapp
    tier: backend
    owner: mayank
spec:
  type: ClusterIP
  selector:
    app: mayankapp
    tier: backend
  ports:
    - port: 8080
      targetPort: 8080
