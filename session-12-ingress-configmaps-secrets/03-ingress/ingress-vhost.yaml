# Virtual-host routing: same IP, the Host header decides which Service answers
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mayank-ingress-vhost
  labels:
    app: mayankapp
    owner: mayank
spec:
  ingressClassName: nginx
  rules:
    - host: portal.mayank.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mayankapp-frontend
                port:
                  number: 80
    - host: api.mayank.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mayankapp-backend
                port:
                  number: 8080
