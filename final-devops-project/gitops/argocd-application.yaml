apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockroom
  namespace: argocd
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    repoURL: https://github.com/mayank-0789/Devops-Assignment-1.git
    targetRevision: main
    path: final-devops-project/helm/stockroom
    helm:
      valueFiles: [values-eks.yaml, values-gitops.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: stockroom
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
  ignoreDifferences:
    # HPA owns backend replicas after the initial deployment.
    - group: apps
      kind: Deployment
      name: stockroom-backend
      jsonPointers: [/spec/replicas]
