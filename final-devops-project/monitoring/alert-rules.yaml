apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stockroom-alerts
  namespace: stockroom
  labels:
    release: monitoring
    owner: mayank
spec:
  groups:
    - name: stockroom
      rules:
        - alert: StockroomBackendDown
          expr: sum(up{job=~".*backend.*", namespace="stockroom"}) == 0
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "No Stockroom backend target is being scraped"}
        - alert: StockroomHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="stockroom", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="stockroom"}[5m])) > 0.05
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "More than 5% of Stockroom requests fail"}
        - alert: StockroomHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="stockroom"}[5m]))) > 0.5
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "Stockroom p95 latency above 500 ms"}
