# Lab 1: a backend Deployment whose image tag does not exist -> ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockroom-broken-image
  namespace: stockroom
  labels: {owner: mayank, lab: troubleshooting}
spec:
  replicas: 1
  selector:
    matchLabels: {app: stockroom-broken-image}
  template:
    metadata:
      labels: {app: stockroom-broken-image}
    spec:
      containers:
        - name: api
          image: stockroom-backend:does-not-exist
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
