# Lab 2: a Service whose selector matches no Pod -> no endpoints, no traffic
apiVersion: v1
kind: Service
metadata:
  name: stockroom-broken-service
  namespace: stockroom
  labels: {owner: mayank, lab: troubleshooting}
spec:
  selector:
    app.kubernetes.io/component: backend-typo
  ports: [{port: 8000, targetPort: 8000}]
